name: Update stats

on:
  schedule:
    - cron: "0 0 * * 1"
  push:
    paths-ignore:
      - "stats/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate stats svg
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          EXCLUDE_LANGS: ${{ vars.EXCLUDE_LANGS }}
          EXCLUDE_REPOS: ${{ vars.EXCLUDE_REPOS }}
        run: node scripts/generate.mjs
      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          git diff --cached --quiet || git commit -m "chore: update stats svg"
          git push
